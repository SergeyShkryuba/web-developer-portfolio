<header class="header fixed top-0 left-0 right-0 z-50 bg-bg/95 backdrop-blur-md border-b border-line">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <a href="/" class="text-2xl font-bold font-display text-accent hover:opacity-80 transition-opacity">
        WebFolio
      </a>

      <div class="hidden md:flex items-center gap-6">
        <nav id="desktop-nav" class="flex items-center space-x-1" aria-label="Main navigation"></nav>

      <button
        id="theme-toggle"
        class="p-2 text-2xl hover:opacity-70 transition-opacity"
        aria-label="Switch to light mode"
      >
        <span>☀️</span>
      </button>
      </div>

      <div class="md:hidden flex items-center gap-2">
        <button
          id="theme-toggle-mobile"
          class="p-2 text-2xl hover:opacity-70 transition-opacity"
          aria-label="Switch to light mode"
        >
          <span>☀️</span>
        </button>

        <button
          class="p-2 space-y-1.5"
          aria-label="Toggle navigation menu"
          aria-expanded="false"
          id="burger"
        >
        <span class="block w-6 h-0.5 bg-ink transition-transform"></span>
        <span class="block w-6 h-0.5 bg-ink transition-opacity"></span>
        <span class="block w-6 h-0.5 bg-ink transition-transform"></span>
      </button>
    </div>
  </div>
</header>

<div class="md:hidden hidden fixed top-16 left-0 right-0 z-40 bg-surface border-b border-line" id="mobile-menu" role="navigation" aria-label="Mobile navigation">
  <div id="mobile-nav" class="px-4 py-3 space-y-1"></div>
</div>
