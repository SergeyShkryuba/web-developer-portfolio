<header class="header fixed top-0 left-0 right-0 z-50 bg-bg/95 backdrop-blur-md border-b border-line">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <a href="/" class="text-2xl font-bold font-display text-accent hover:opacity-80 transition-opacity">
        WebFolio
      </a>

      <nav class="hidden md:flex items-center space-x-1" aria-label="Main navigation">
        <a
          href="/"
          class="px-4 py-2 text-ink hover:text-accent font-medium transition-colors relative group"
          data-page="home"
        >
          Home
          <span
            class="absolute bottom-0 left-4 right-4 h-0.5 bg-accent transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left"
          ></span>
        </a>

        <a
          href="/#about"
          class="px-4 py-2 text-ink hover:text-accent font-medium transition-colors relative group"
          data-page="about"
        >
          About
          <span
            class="absolute bottom-0 left-4 right-4 h-0.5 bg-accent transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left"
          ></span>
        </a>

        <a
          href="/#skills"
          class="px-4 py-2 text-ink hover:text-accent font-medium transition-colors relative group"
          data-page="skills"
        >
          Skills
          <span
            class="absolute bottom-0 left-4 right-4 h-0.5 bg-accent transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left"
          ></span>
        </a>

        <a
          href="/#projects"
          class="px-4 py-2 text-ink hover:text-accent font-medium transition-colors relative group"
          data-page="projects"
        >
          Projects
          <span
            class="absolute bottom-0 left-4 right-4 h-0.5 bg-accent transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left"
          ></span>
        </a>

        <a
          href="/#experience"
          class="px-4 py-2 text-ink hover:text-accent font-medium transition-colors relative group"
          data-page="experience"
        >
          Experience
          <span
            class="absolute bottom-0 left-4 right-4 h-0.5 bg-accent transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left"
          ></span>
        </a>

        <a
          href="/pages/contact.html"
          class="px-4 py-2 text-ink hover:text-accent font-medium transition-colors relative group"
          data-page="contact"
        >
          Contact
          <span
            class="absolute bottom-0 left-4 right-4 h-0.5 bg-accent transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left"
          ></span>
        </a>
      </nav>

      <button
        class="md:hidden p-2 space-y-1.5"
        aria-label="Toggle navigation menu"
        aria-expanded="false"
        id="burger"
      >
        <span class="block w-6 h-0.5 bg-ink transition-transform"></span>
        <span class="block w-6 h-0.5 bg-ink transition-opacity"></span>
        <span class="block w-6 h-0.5 bg-ink transition-transform"></span>
      </button>
    </div>
  </div>

  <div class="md:hidden hidden" id="mobile-menu" role="navigation" aria-label="Mobile navigation">
    <div class="px-4 py-3 space-y-1 bg-surface border-t border-line">
      <a
        href="/"
        class="block px-4 py-2 text-ink hover:text-accent hover:bg-surface-2 rounded-lg font-medium"
        data-page="home"
      >
        Home
      </a>
      <a
        href="/#about"
        class="block px-4 py-2 text-ink hover:text-accent hover:bg-surface-2 rounded-lg font-medium"
        data-page="about"
      >
        About
      </a>
      <a
        href="/#skills"
        class="block px-4 py-2 text-ink hover:text-accent hover:bg-surface-2 rounded-lg font-medium"
        data-page="skills"
      >
        Skills
      </a>
      <a
        href="/#projects"
        class="block px-4 py-2 text-ink hover:text-accent hover:bg-surface-2 rounded-lg font-medium"
        data-page="projects"
      >
        Projects
      </a>
      <a
        href="/#experience"
        class="block px-4 py-2 text-ink hover:text-accent hover:bg-surface-2 rounded-lg font-medium"
        data-page="experience"
      >
        Experience
      </a>
      <a
        href="/pages/contact.html"
        class="block px-4 py-2 text-ink hover:text-accent hover:bg-surface-2 rounded-lg font-medium"
        data-page="contact"
      >
        Contact
      </a>
    </div>
  </div>
</header>
