<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Serhii Shkriuba</title>
    <meta name="description" content="Get in touch with Serhii Shkriuba, junior web developer. Open to internships and junior roles." />
    <meta property="og:title" content="Contact — Serhii Shkriuba" />
    <meta property="og:description" content="Get in touch with Serhii Shkriuba, junior web developer. Open to internships and junior roles." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://webfolio.dev/pages/contact.html" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Contact — Serhii Shkriuba" />
    <meta name="twitter:description" content="Get in touch with Serhii Shkriuba, junior web developer. Open to internships and junior roles." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="preloader" class="fixed inset-0 bg-bg grid place-items-center z-[9999] transition-opacity duration-[400ms] ease-[var(--ease-out)]">
      <div class="w-12 h-12 border-[3px] border-line border-t-accent rounded-full animate-spin" role="status" aria-label="Loading"></div>
    </div>

    <!-- inject:header -->

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-16">
      <h1 class="text-5xl md:text-6xl font-display font-bold text-ink mb-4">Get in touch</h1>
      <p class="text-lg text-muted mb-10">
        Have a project or opportunity? Fill out the form below and I will get back to you.
      </p>

      <section class="bg-surface border border-line rounded-md p-6 md:p-8 reveal reveal--slide-up">
        <form id="contactForm" novalidate>
          <div class="space-y-6">
            <div>
              <label for="name" class="block text-sm font-medium text-ink mb-2">Name</label>
              <input
                type="text"
                id="name"
                name="name"
                required
                class="w-full bg-bg border border-line rounded-md px-4 py-3 text-ink placeholder-muted focus:border-accent focus:outline-none transition-colors"
                placeholder="How should I call you"
              />
            </div>

            <div>
              <label for="email" class="block text-sm font-medium text-ink mb-2">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                class="w-full bg-bg border border-line rounded-md px-4 py-3 text-ink placeholder-muted focus:border-accent focus:outline-none transition-colors"
                placeholder="you@example.com"
              />
            </div>

            <div>
              <label for="message" class="block text-sm font-medium text-ink mb-2">Message</label>
              <textarea
                id="message"
                name="message"
                rows="5"
                required
                class="w-full bg-bg border border-line rounded-md px-4 py-3 text-ink placeholder-muted focus:border-accent focus:outline-none transition-colors resize-y"
                placeholder="A few words about the role or project"
              ></textarea>
            </div>

            <button
              type="submit"
              class="w-full sm:w-auto px-8 py-3 bg-accent text-on-accent font-display font-bold rounded-md hover:bg-transparent hover:text-accent border-2 border-accent transition-colors"
            >
              Send message
            </button>
          </div>
        </form>
      </section>
    </main>

    <!-- inject:footer -->

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
